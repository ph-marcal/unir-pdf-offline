<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclador de PDF Premium - Local & Visual</title>
    
    <!-- Bibliotecas Necessárias via CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        :root {
            --primary: #e74c3c; /* Vermelho estilo iLovePDF */
            --primary-hover: #c0392b;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --gray-btn: #7f8c8d;
            --gray-btn-hover: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 1.8rem;
        }

        .notice {
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: #2c3e50;
            border-radius: 0 8px 8px 0;
        }

        .upload-area {
            border: 2px dashed #b2bec3;
            padding: 30px;
            text-align: center;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #fff5f5;
        }

        input[type="file"] {
            display: none;
        }

        /* Grade / Painel de Miniaturas Estilo iLovePDF */
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin: 30px 0;
            padding: 15px;
            background: #f1f2f6;
            border-radius: 8px;
            min-height: 180px;
        }

        .pdf-card {
            background: #fff;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            position: relative;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .pdf-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .pdf-card.dragging {
            opacity: 0.4;
            border: 2px dashed var(--primary);
            background: #fafafa;
        }

        .thumbnail-container {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }

        .thumbnail-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .pdf-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #2c3e50;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .pdf-name {
            font-size: 0.8rem;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Configurações Finais e Botões */
        .output-section {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 2;
            min-width: 250px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        button {
            flex: 1;
            color: white;
            border: none;
            padding: 14px 15px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            height: 48px;
            white-space: nowrap;
        }

        .btn-merge {
            background-color: var(--primary);
        }

        .btn-merge:hover {
            background-color: var(--primary-hover);
        }

        .btn-clear {
            background-color: var(--gray-btn);
        }

        .btn-clear:hover {
            background-color: var(--gray-btn-hover);
        }

        button:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
        
        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Mesclador de PDFs Visual</h2>
    <div class="notice">
        <strong>Segurança Local Ativa:</strong> A junção dos PDFs acontece inteiramente no seu navegador. Seus arquivos não saem do seu computador.
    </div>

    <!-- Área de Upload que imita clique -->
    <div class="upload-area">
        <p style="margin:0; font-size: 1.1rem; color: #555;">
            <strong>Clique aqui</strong> para selecionar seus arquivos PDF
        </p>
        <span style="font-size: 0.85rem; color: #7f8c8d;">Você pode selecionar vários de uma vez</span>
        <input type="file" id="pdf-files" accept="application/pdf" multiple>
    </div>

    <!-- Painel de Ordenação Visual -->
    <div class="pdf-grid" id="pdf-grid">
        <div style="grid-column: 1/-1; text-align: center; color: #7f8c8d; padding-top: 60px;">
            Nenhum documento carregado ainda.
        </div>
    </div>

    <!-- Nome Final e Ações -->
    <div class="output-section">
        <div class="input-group">
            <label for="output-name">Nome do arquivo final:</label>
            <input type="text" id="output-name" value="Documento_Consolidado" placeholder="Ex: Relatorios_Agrupados">
        </div>
        <div class="button-group">
            <button class="btn-clear" id="clear-btn">Limpar Tudo</button>
            <button class="btn-merge" id="merge-btn">Mesclar e Baixar</button>
        </div>
    </div>

    <div id="status"></div>
</div>

<script>
    // Configurando o worker do PDF.js obrigatório para renderização
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let selectedFiles = [];
    
    // --- Elementos do DOM ---
    const fileInput = document.getElementById('pdf-files');
    const grid = document.getElementById('pdf-grid');
    const statusDiv = document.getElementById('status');
    const mergeBtn = document.getElementById('merge-btn');
    const clearBtn = document.getElementById('clear-btn');
    const outputNameInput = document.getElementById('output-name');
    const uploadArea = document.querySelector('.upload-area');

    // --- Funções ---

    async function handleFileSelection(event) {
        const files = Array.from(fileInput.files);
        if (files.length === 0) return;

        statusDiv.className = '';
        statusDiv.innerText = 'Gerando miniaturas...';

        for (const file of files) {
            try {
                // Criar uma URL temporária para o arquivo para renderização
                const url = URL.createObjectURL(file);
                const { thumbDataUrl, pageCount } = await generateThumbnailAndCountPages(url);
                
                selectedFiles.push({
                    fileObj: file,
                    thumb: thumbDataUrl
                });
            } catch (e) {
                console.error("Erro ao gerar miniatura para: " + file.name, e);
                selectedFiles.push({
                    fileObj: file,
                    thumb: ''
                });
            }
        }

        renderGrid();
        fileInput.value = ''; 
        statusDiv.innerText = '';
    }

    async function generateThumbnailAndCountPages(pdfUrl) {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        
        const viewport = page.getViewport({ scale: 0.4 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
            canvasContext: context,
            viewport: viewport
        };
        
        await page.render(renderContext).promise;
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8); // Usar JPEG para melhor compressão
        
        // Revogar a URL do objeto para liberar memória
        URL.revokeObjectURL(pdfUrl);

        return { thumbDataUrl: dataUrl, pageCount: pdf.numPages };
    }

    function renderGrid() {
        grid.innerHTML = '';

        if (selectedFiles.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #7f8c8d; padding-top: 60px;">Nenhum documento carregado.</div>`;
            return;
        }

        selectedFiles.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'pdf-card';
            card.draggable = true;
            card.dataset.index = index;

            const imgHtml = item.thumb 
                ? `<img class="thumbnail-img" src="${item.thumb}" alt="Preview">`
                : `<span style="font-size:3rem; color:#b2bec3;">📄</span>`;

            card.innerHTML = `
                <span class="pdf-badge">${index + 1}</span>
                <div class="remove-btn" data-index="${index}">✕</div>
                <div class="thumbnail-container">
                    ${imgHtml}
                </div>
                <div class="pdf-name" title="${item.fileObj.name}">${item.fileObj.name}</div>
            `;

            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            grid.appendChild(card);
        });        
    }

    function setupGridDragAndDrop() {
        grid.addEventListener('dragover', e => {
            e.preventDefault();
            const draggingCard = document.querySelector('.pdf-card.dragging');
            if (!draggingCard) return;

            const siblings = [...grid.querySelectorAll('.pdf-card:not(.dragging)')];
            
            let nextSibling = siblings.find(sibling => {
                const box = sibling.getBoundingClientRect();
                const offset = e.clientX - box.left - box.width / 2;
                const offsetTop = e.clientY - box.top - box.height / 2;
                return offset < 0 && offsetTop < 0; 
            });
            
            if (!nextSibling) {
                nextSibling = siblings.find(sibling => {
                    const box = sibling.getBoundingClientRect();
                    return e.clientX <= box.left + box.width / 2;
                });
            }

            grid.insertBefore(draggingCard, nextSibling);
        });

        grid.addEventListener('drop', () => {
            const currentCards = [...grid.querySelectorAll('.pdf-card')];
            const newOrder = currentCards.map(card => selectedFiles[card.dataset.index]);
            selectedFiles = newOrder;
            renderGrid();
        });
    }

    function handleGridClick(event) {
        if (event.target.classList.contains('remove-btn')) {
            const indexToRemove = parseInt(event.target.dataset.index, 10);
            selectedFiles.splice(indexToRemove, 1);
            renderGrid();
        }
    }

    function clearAll() {
        selectedFiles = [];
        renderGrid();
        outputNameInput.value = 'Documento_Consolidado';
        statusDiv.className = '';
        statusDiv.innerText = '';
        fileInput.value = '';
    }

    async function mergePDFs() {
        if (mergeBtn.disabled) return;

        let outputName = outputNameInput.value.trim();

        if (selectedFiles.length < 2) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Por favor, carregue pelo menos 2 arquivos PDF para combinar.';
            return;
        }

        if (!outputName) outputName = 'Documento_Consolidado';
        if (!outputName.toLowerCase().endsWith('.pdf')) outputName += '.pdf';

        mergeBtn.disabled = true;
        clearBtn.disabled = true;
        mergeBtn.innerHTML = `<span class="spinner"></span> Processando...`;
        statusDiv.className = '';
        statusDiv.innerText = 'Mesclando páginas...';

        try {
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();

            for (const item of selectedFiles) {
                const arrayBuffer = await item.fileObj.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer, { 
                    // Ignorar erros de documentos malformados para aumentar a compatibilidade
                    ignoreEncryption: true 
                });
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }

            const mergedPdfBytes = await mergedPdf.save();
            const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = outputName;
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            statusDiv.className = 'success';
            statusDiv.innerText = 'Sucesso! O arquivo combinado foi gerado e baixado.';
        } catch (error) {
            console.error(error);
            statusDiv.className = 'error';
            statusDiv.innerText = 'Falha ao processar os arquivos. Verifique se não estão corrompidos ou protegidos por senha.';
        } finally {
            mergeBtn.disabled = false;
            clearBtn.disabled = false;
            mergeBtn.innerText = 'Mesclar e Baixar';
        }
    }
</script>
<script>
    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelection);
        mergeBtn.addEventListener('click', mergePDFs);
        clearBtn.addEventListener('click', clearAll);
        grid.addEventListener('click', handleGridClick); // Delegação de eventos para o botão remover
        setupGridDragAndDrop();
    });
</script>

</body>
</html>
